# mochou-p/editerm/Cargo.toml

[package]
publish      = false
name         = "editerm"
version      = "0.0.0"
edition      = "2024"
rust-version = "1.92.0"
authors      = ["mochou-p"]
description  = "a based text-based text editor"
readme       = "README.md"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/mochou-p/editerm"
keywords     = ["editor", "text", "text-editor", "text-based"]
categories   = ["text-editors", "command-line-utilities", "development-tools", "filesystem"]

[profile.release]
opt-level        = "z"
debug            = "none"
strip            = "symbols"
debug-assertions = false
overflow-checks  = true
lto              = "fat"
panic            = "unwind"
incremental      = false
codegen-units    = 1

[profile.release.package."*"]
opt-level        = "z"
debug            = "none"
strip            = "symbols"
debug-assertions = false
overflow-checks  = true
incremental      = false
codegen-units    = 1

[dependencies]
spliterm = { git = "https://github.com/mochou-p/spliterm" }
